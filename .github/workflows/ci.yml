name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Infos (e.g. async BuildContext) must not fail CI; warnings/errors do.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
