org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Mixed Kotlin Gradle Plugin versions left incomplete release class jars for
# device_info_plus / package_info_plus. Disable incremental Kotlin so a clean
# compile always emits the plugin classes GeneratedPluginRegistrant needs.
kotlin.incremental=false
# Android Studio's bundled JBR is JDK 25; Kotlin's JavaVersion parser throws
# IllegalArgumentException: 25.0.2. Pin the Gradle daemon to JDK 21 instead.
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
