name: obecno
description: "Obecno location-based attendance"

publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.8.1
  svg_flutter: ^0.0.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  permission_handler: ^11.4.0
  connectivity_plus: ^6.1.3
  country_pickers: ^3.0.0
  pinput: ^5.0.1
  http: ^1.3.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  geolocator: ^13.0.4
  sqflite: ^2.4.2
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0
  system_clock: ^2.0.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/navigation/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
    - family: Arvo
      fonts:
        - asset: assets/fonts/Arvo-Regular.ttf
          weight: 500
        - asset: assets/fonts/Arvo-Bold.ttf
          weight: 700

flutter_assets:
  assets_path: assets/
  output_path: lib/generated/
  filename: assets.dart
  field_prefix: ""
